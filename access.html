<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062b5c" />
    <meta name="robots" content="noindex" />
    <title>כניסה למסלול | Wroc-love</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="access.css" />
  </head>
  <body class="access-body">
    <main class="access-shell">
      <a class="brand access-brand" href="/">
        <img src="assets/logo.png" alt="Wrocław & Lower Silesia" />
        <span><strong>Wroc-love</strong><small>המסלול שלכם לוורוצלב</small></span>
      </a>

      <section class="access-card">
        <span class="eyebrow">כניסה למסלול המלא</span>
        <h1>הזינו את קוד הגישה שקיבלתם</h1>
        <p>הקוד מופעל בפעם הראשונה שבה משתמשים בו ומעניק גישה למשך 30 יום.</p>

        <form id="access-form" novalidate>
          <label for="access-code">קוד גישה</label>
          <input id="access-code" name="code" type="text" inputmode="text" autocomplete="one-time-code" placeholder="WROC-XXXX-XXXX" maxlength="20" required />
          <button class="button button-primary" type="submit">כניסה למסלול</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <div class="access-help">
          <strong>עדיין אין לכם קוד?</strong>
          <span>אפשר לרכוש גישה מאובטחת ל־30 יום ב־49 ₪.</span>
          <a class="button button-primary" href="/checkout.html">רכישת גישה</a>
          <a href="/#premium">חזרה לפרטי המסלול</a>
        </div>
      </section>
    </main>
    <script src="site-i18n.js" defer></script>
    <script src="access.js" defer></script>
  </body>
</html>
