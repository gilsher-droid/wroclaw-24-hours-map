name: Validate news pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate and validate canonical catalog
        run: |
          node tools/generate-place-catalog.mjs
          node tools/validate-place-catalog.mjs
          node tools/validate-canonical-experiences.mjs
          node tools/validate-now-in-wroclaw.mjs
      - name: Build static site
        run: node build-static.mjs
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Test private album authentication and storage
        run: |
          python3 tests/personal-trip-album-server.test.py
          python3 tests/personal-trip-owner-admin.test.py
          python3 tests/community-contributions.test.py
          python3 tests/personal-trip-nearby.test.py
      - name: Verify canonical catalog in Pages artifact
        run: node tools/verify-pages-artifact.mjs
